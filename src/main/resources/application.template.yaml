spring:
  application:
    name: TelegramBots

logging:
  level:
    root: INFO
    org.springframework: INFO
    fr.ses10doigts.telegrambots: DEBUG

telegram:
  enabled: true
  builtin-controller-enabled: true # Set to false to disable /help and /whoami built-in commands
  default-bot-id: main-bot
  polling-logging:
    # ERROR (default): keep telegram library ERROR log
    # WARN: demote repeated 409 conflict log to WARN
    # OFF: hide this specific 409 conflict log line
    conflict-409-log-mode: WARN
  bots:
    - id: main-bot
      token: YourToken
      polling-enabled: true
      auto-register-commands: true
      configure-menu-button: true
      security:
        allowed-user-ids:
          - 123456789
      retry:
        enabled: true
        max-attempts: 3
        delaySeconds: 10

    - id: secondary-bot
      token: YourSecondToken
      polling-enabled: true
      auto-register-commands: true
      configure-menu-button: true
      security:
        allowed-user-ids:
          - 123456789
